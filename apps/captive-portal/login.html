<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperNet HotSpot - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Hind Siliguri', 'Outfit', sans-serif;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .header { text-align: center; margin-bottom: 1.5rem; }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      border-radius: 1rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.3);
    }
    .logo-badge svg { width: 32px; height: 32px; fill: white; }
    .title { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .subtitle { font-size: 0.9rem; color: var(--text-muted); }
    
    .tabs { display: flex; background: rgba(15, 23, 42, 0.6); border-radius: 0.75rem; padding: 4px; margin-bottom: 1.5rem; }
    .tab-btn {
      flex: 1;
      padding: 0.6rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active { background: var(--primary); color: #fff; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; color: #cbd5e1; }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 0.6rem;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      border-radius: 0.6rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.2s;
      box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.3);
    }
    .btn-submit:hover { opacity: 0.95; transform: translateY(-1px); }

    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 0.75rem;
      border-radius: 0.6rem;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1rem;
    }
    .footer a { color: #38bdf8; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      </div>
      <h1 class="title">SuperNet HotSpot</h1>
      <p class="subtitle">হাই-স্পিড ওয়াইফাই ইন্টারনেটে স্বাগতম</p>
    </div>

    <!-- MikroTik Error Variable Display -->
    <!-- $(if error) -->
    <div class="alert-error">
      $(error)
    </div>
    <!-- $(endif) -->

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('voucher')">ভাউচার কোড</button>
      <button class="tab-btn" onclick="switchTab('member')">মেম্বার লগইন</button>
    </div>

    <!-- Voucher Form -->
    <form id="voucher-form" name="login" action="$(link-login-only)" method="post">
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />
      
      <div class="form-group">
        <label for="v-code">ভাউচার কোড (Voucher Code)</label>
        <input type="text" id="v-code" name="username" placeholder="HS-XXXXXX" required autocomplete="off" oninput="syncVoucherPass(this.value)" />
      </div>
      <input type="hidden" id="v-pass" name="password" value="" />

      <button type="submit" class="btn-submit">ইন্টারনেট কানেক্ট করুন</button>
    </form>

    <!-- Member Form (Hidden by default) -->
    <form id="member-form" name="login" action="$(link-login-only)" method="post" style="display:none;">
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />

      <div class="form-group">
        <label for="m-user">ইউজারনেম (Username)</label>
        <input type="text" id="m-user" name="username" placeholder="আপনার ইউজারনেম" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="m-pass">পাসওয়ার্ড (Password)</label>
        <input type="password" id="m-pass" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-submit">লগইন করুন</button>
    </form>

    <div class="footer">
      <p>সাহায্যের জন্য কল করুন: <a href="tel:+8801700000000">+880 1700-000000</a></p>
      <p style="margin-top: 4px; opacity: 0.7;">Powered by MikroTik RouterOS 7 Management</p>
    </div>
  </div>

  <script>
    function switchTab(type) {
      const vForm = document.getElementById('voucher-form');
      const mForm = document.getElementById('member-form');
      const btns = document.querySelectorAll('.tab-btn');

      if (type === 'voucher') {
        vForm.style.display = 'block';
        mForm.style.display = 'none';
        btns[0].classList.add('active');
        btns[1].classList.remove('active');
      } else {
        vForm.style.display = 'none';
        mForm.style.display = 'block';
        btns[0].classList.remove('active');
        btns[1].classList.add('active');
      }
    }

    function syncVoucherPass(val) {
      document.getElementById('v-pass').value = val.trim();
    }
  </script>
</body>
</html>
